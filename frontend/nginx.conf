map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Open File Descriptor Cache
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # NOTE ON add_header: a location block that declares ANY add_header
    # discards every add_header inherited from the server block. The security
    # headers below are therefore repeated in each location that sets its own
    # caching headers — previously they were silently dropped for HTML pages
    # and every static asset.

    # Immutable static assets caching (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # High-Performance Reverse Proxy for API requests
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade. This block previously forced `Connection ""`,
        # which meant the chat socket at /api/v1/chats/ws/<id> could never
        # complete its handshake in any containerised deployment.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Refresh-Token $http_x_refresh_token;
        proxy_pass_header Authorization;
        proxy_pass_header X-Refresh-Token;

        # Buffer Tuning
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
        proxy_read_timeout 3600s;   # long-lived chat sockets
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
        client_max_body_size 16M;   # matches the backend's 15 MB upload cap
    }

    # Media used to be proxied straight to MinIO on a bucket with a
    # world-readable policy, which exposed identity documents and the backup
    # bot's database archives. Legacy /baito-bucket/<key> URLs stored in the
    # database are redirected to the authenticated media endpoint instead.
    location ^~ /baito-bucket/ {
        rewrite ^/baito-bucket/(.*)$ /api/v1/media/$1 last;
    }

    # SPA Routing fallback. HTML must never be cached hard, otherwise clients
    # keep booting an old bundle after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        # `expires -1` would emit a second, weaker Cache-Control header
        # alongside the explicit one below, so it is deliberately omitted.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        # index.html carries inline bootstrap scripts, so 'unsafe-inline' is
        # required for script-src until those move into the bundle.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

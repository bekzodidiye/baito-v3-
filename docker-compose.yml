# IMAGE_TAG pins which build of the application images to run. CI sets it to
# the commit SHA, so the previous build stays on disk and rollback is a single
# `IMAGE_TAG=<sha> docker compose up -d --no-build`. See scripts/rollback.sh.
#
# Secrets have no defaults in this file. Every ${VAR:?...} below refuses to
# start the stack unless the value is present in .env — the previous version
# shipped a working JWT signing key, a live Telegram bot token and the
# passwords "password" / "minioadmin" as fallbacks, all of them committed.
#
# Backing services bind to 127.0.0.1 only. Publishing Postgres and MinIO on
# 0.0.0.0 exposed them to every host on the LAN and the tailnet.

networks:
  baito_net:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    mem_limit: 2g
    image: postgres:15-alpine
    restart: unless-stopped
    # Postgres shipped on stock defaults: 128 MB shared_buffers on a 7.6 GB
    # box, and random_page_cost=4 which is an spinning-disk assumption that
    # pushes the planner away from index scans. The two timeouts stop a single
    # runaway query or a leaked transaction from pinning a connection or
    # blocking VACUUM indefinitely.
    command: >
      postgres
      -c shared_buffers=1536MB
      -c effective_cache_size=4GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c statement_timeout=30s
      -c idle_in_transaction_session_timeout=60s
      -c max_connections=100
      -c wal_compression=on
      -c checkpoint_completion_target=0.9
      -c min_wal_size=512MB
      -c max_wal_size=2GB
    networks:
      - baito_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-baito}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-baito}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis:
    mem_limit: 256m
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    networks:
      - baito_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  minio:
    mem_limit: 512m
    image: minio/minio:latest
    restart: unless-stopped
    networks:
      - baito_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  migrate:
    image: baito-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    networks:
      - baito_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baito}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    logging: *default-logging

  backend:
    # Four uvicorn workers rather than two. Two of them measured 273 MB idle and
    # 529 MB under load, so four could crowd a 1 GB cap and be OOM-killed mid
    # request. The box has 7.7 GB with 4.7 GB free and the compose file hands
    # out 5.2 GB in total, so the extra half gigabyte is there to give.
    mem_limit: 1536m
    image: baito-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - baito_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - TZ=Asia/Tashkent
      # Without this the app ran in development mode in production: /docs was
      # served publicly, cookies lost Secure/SameSite=strict and HSTS was off.
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baito}
      - REDIS_URL=redis://redis:6379/0
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-baito-bucket}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TEXTUP_EMAIL=${TEXTUP_EMAIL:-}
      - TEXTUP_PASSWORD=${TEXTUP_PASSWORD:-}
      - UZUM_TERMINAL_ID=${UZUM_TERMINAL_ID:-}
      - UZUM_SECRET_KEY=${UZUM_SECRET_KEY:-}
      - UZUM_API_URL=${UZUM_API_URL:-https://api.uzum.uz/epos/v1}
      # Merchant API — the webhooks Uzum calls on us. Separate credentials from
      # the three above, which are for the checkout product. The service refuses
      # every webhook with 10001 until all three are present, so leaving them
      # empty is safe; leaving them out of this list is not, because then
      # nothing in .env can reach the container.
      - UZUM_MERCHANT_SERVICE_ID=${UZUM_MERCHANT_SERVICE_ID:-0}
      - UZUM_MERCHANT_USERNAME=${UZUM_MERCHANT_USERNAME:-}
      - UZUM_MERCHANT_PASSWORD=${UZUM_MERCHANT_PASSWORD:-}
      # SMTP, for the invoice a company is sent after a payout. These were
      # added to app/core/config.py when the payout flow was built and never
      # added here, so setting them in .env did nothing at all: the app kept
      # answering "Pochta serveri sozlanmagan" with all four values present on
      # disk. Exactly what the Uzum note above warns about.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      # Where the "pay this invoice" button in that mail points. Read outside
      # the app, so it has to be absolute. Left empty it falls back to the
      # first real https origin in CORS_ORIGINS.
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Used by the error reporter, not just the backup bot.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
    # Reachable through the frontend's nginx proxy; not published to the host.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  celery_worker:
    mem_limit: 512m
    image: baito-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    networks:
      - baito_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Tashkent
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baito}
      - REDIS_URL=redis://redis:6379/0
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - TEXTUP_EMAIL=${TEXTUP_EMAIL:-}
      - TEXTUP_PASSWORD=${TEXTUP_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # Scheduler for the periodic tasks (job expiry, idempotency-key cleanup).
  # There was no beat service at all, so nothing scheduled ever ran.
  celery_beat:
    mem_limit: 256m
    image: baito-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    networks:
      - baito_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Tashkent
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baito}
      - REDIS_URL=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
    logging: *default-logging

  backup_bot:
    mem_limit: 512m
    image: baito-backup-bot:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    networks:
      - baito_net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./backend/scripts/backup_bot.py:/app/backup_bot.py:ro
      - ./backend/uploads:/app/uploads:ro
      - ./.env:/app/.env:ro
      - ./backend/.env:/app/backend/.env:ro
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - TZ=Asia/Tashkent
      - SECRET_KEY=${SECRET_KEY:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      # The bot token used to be committed here as a default value. It is now
      # supplied only from .env — and left OPTIONAL on purpose: backup_bot.py
      # exits on its own when it is missing, so an absent token stops the
      # backup bot rather than blocking the whole stack from starting.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      # Extra Telegram user ids allowed to drive the bot, comma-separated.
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS:-}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-baito}
      - POSTGRES_HOST=db
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-baito-bucket}
      - S3_BUCKET_PATH=s3://${BACKUP_BUCKET_NAME:-baito-backups}/
      # Optional second destination, off this machine. All four must be set or
      # the offsite copy stays disabled — the local backup is unaffected.
      - OFFSITE_S3_ENDPOINT=${OFFSITE_S3_ENDPOINT:-}
      - OFFSITE_S3_BUCKET=${OFFSITE_S3_BUCKET:-}
      - OFFSITE_S3_KEY_ID=${OFFSITE_S3_KEY_ID:-}
      - OFFSITE_S3_SECRET=${OFFSITE_S3_SECRET:-}
      - OFFSITE_S3_REGION=${OFFSITE_S3_REGION:-us-west-004}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/app/backups') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  frontend:
    mem_limit: 256m
    image: baito-frontend:${IMAGE_TAG:-current}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The root package.json is the version's source of truth and sits
        # outside this build context, so the deploy reads it and passes it here.
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    networks:
      - baito_net
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:

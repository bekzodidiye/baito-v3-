# Dependabot configuration for baito monorepo
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
# Auto-merge takes any Dependabot PR whose checks are green, straight to a
# production deploy, and it has no way to tell a patch from a major: it runs on
# workflow_run and workflow_dispatch, neither of which carries the pull_request
# context that dependabot/fetch-metadata needs to report an update type. So the
# gate has to live here.
#
# Majors are held back because they are the ones that break: #66 bumped React a
# major and cleared `npm ci` before failing 14 of 23 frontend suites, and #59
# proposed python 3.11 -> 3.14, which ci.yml documents as having no
# psycopg2-binary wheel. Those are decisions to take deliberately, not ones to
# wake up already merged.
#
# The `version-update:` prefix scopes this to routine version bumps only.
# Security updates are unaffected and still open, majors included.
#
# github-actions is deliberately left out: its majors are mostly runner
# deprecations - actions/checkout@v4 is already being forced onto Node 24 - and
# holding those back is the more dangerous half of the trade.
updates:
  # Root npm dependencies.
  #
  # This one entry covers the frontend too. The root package.json declares
  # `workspaces: ["frontend"]`, so npm keeps a single lockfile at the root and
  # `npm ci` inside frontend/ resolves up to it - frontend/package-lock.json is
  # never read. A second entry on /frontend therefore updated
  # frontend/package.json and a lockfile nothing consults, while the root lock
  # kept the old resolutions, and `npm ci` refused the mismatch:
  #
  #   npm error Invalid: lock file's @playwright/test@1.62.1
  #             does not satisfy @playwright/test@1.63.0
  #
  # Every /frontend-scoped PR was red for that reason and could never go green
  # on its own. Dependabot understands workspaces: from here it updates the
  # member manifest and the root lock together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        dependency-type: "production"
      devDependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Mobile Capacitor dependencies
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        dependency-type: "production"
      devDependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend FastAPI / Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Docker dependencies (Backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker dependencies (Frontend)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

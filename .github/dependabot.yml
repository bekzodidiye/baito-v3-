# Dependabot configuration for baito monorepo
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root npm dependencies.
  #
  # This one entry covers the frontend too. The root package.json declares
  # `workspaces: ["frontend"]`, so npm keeps a single lockfile at the root and
  # `npm ci` inside frontend/ resolves up to it - frontend/package-lock.json is
  # never read. A second entry on /frontend therefore updated
  # frontend/package.json and a lockfile nothing consults, while the root lock
  # kept the old resolutions, and `npm ci` refused the mismatch:
  #
  #   npm error Invalid: lock file's @playwright/test@1.62.1
  #             does not satisfy @playwright/test@1.63.0
  #
  # Every /frontend-scoped PR was red for that reason and could never go green
  # on its own. Dependabot understands workspaces: from here it updates the
  # member manifest and the root lock together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        dependency-type: "production"
      devDependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # Mobile Capacitor dependencies
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        dependency-type: "production"
      devDependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # Backend FastAPI / Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Docker dependencies (Backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker dependencies (Frontend)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
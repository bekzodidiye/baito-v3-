name: Skylos Analysis

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skylos:
    name: Skylos Quality Gate
    runs-on: [self-hosted, laptop-test-runner]
    timeout-minutes: 15

    permissions:
      contents: read
      # Needed by `skylos cicd review`, which posts inline comments.
      pull-requests: write
      # id-token: write was dropped. It exists to mint an OIDC token for
      # Skylos Cloud, and the sync step already tolerates its absence
      # (`skylos sync pull || echo ...`). Skylos flagged the permission in its
      # own workflow as a privilege expansion, and it was right: nothing here
      # uses it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Skylos
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install skylos==4.35.0
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Pull Skylos Cloud Policy
        run: |
          skylos sync pull || echo "No Skylos Cloud policy available through GitHub OIDC; continuing with local config."


      - name: Run Skylos Analysis
        run: |
          # --exclude tests: the danger rules read `redis_client.get(key)` as
          # "tainted URL passed to HTTP client" and the heaviest concentration
          # of that was backend/tests - 41 findings in one file. Excluding the
          # suites drops danger from 242 to 68 with nothing real lost; a test
          # calling Redis is not an SSRF.
          #
          # --baseline needs .skylos/baseline.json, which is committed. Without
          # it the flag is a no-op ("No baseline found") and the gate measures
          # the whole backlog instead of what a change introduced: it last ran
          # against 1328 quality issues with a threshold of 10, which is why it
          # was switched off rather than read.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
            skylos . --danger --quality --ai-defects --secrets --sca --exclude tests --baseline --diff-base "$pr_base_ref" --diff "$pr_base_ref" --json -o skylos-results.json
          else
            skylos . --danger --quality --ai-defects --secrets --sca --exclude tests --baseline --json -o skylos-results.json
          fi

      - name: Quality Gate
        if: always()
        run: skylos cicd gate --input skylos-results.json --summary

      - name: GitHub Annotations
        if: always()
        run: skylos cicd annotate --input skylos-results.json

      - name: PR Review Comments
        if: github.event_name == 'pull_request' && always()
        run: |
          pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
          skylos cicd review --input skylos-results.json --diff-base "$pr_base_ref" --evidence-cards
        env:
          GH_TOKEN: ${{ github.token }}

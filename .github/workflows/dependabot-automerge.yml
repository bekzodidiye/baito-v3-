name: 🤖 Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["🚀 Baito CI/CD & Deployment Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # statusCheckRollup is a GraphQL field gated behind the checks and statuses
  # scopes. Naming any permission in this block drops every unnamed one to
  # `none`, so with only the two above, `gh pr view --json statusCheckRollup`
  # came back with
  #   GraphQL: Resource not accessible by integration
  # and, under `bash -e`, took the whole batch step down on the first PR it
  # looked at - every later PR went uninspected.
  checks: read
  statuses: read

jobs:
  automerge:
    name: Auto-merge Passing Dependabot PRs
    runs-on: [self-hosted, laptop-test-runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto-merge on successful workflow_run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The PR number used to be read out of the event payload with jq.
          # jq is not installed on this runner, and it was the first command
          # in the step, so every run that actually got this far died on it:
          #
          #   jq: command not found
          #   ##[error]Process completed with exit code 127
          #
          # Nothing said so, because the runs that looked green were the ones
          # where the `if` above was false and the step never ran at all. So
          # auto-merge had not merged anything on this runner, and the
          # workflow's own history read as healthy.
          #
          # gh carries jq internally, so asking the API which pull request
          # owns the commit keeps the dependency list at `gh` alone. It is
          # also the more reliable source: workflow_run.pull_requests comes
          # back empty for a fork's PR, which is most of what Dependabot
          # opens on some setups.
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                        --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR is associated with commit ${HEAD_SHA}."
            exit 0
          fi

          echo "Checking PR #$PR_NUMBER..."
          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login' 2>/dev/null || true)
          if [ "$PR_AUTHOR" != "dependabot[bot]" ] && [ "$PR_AUTHOR" != "app/dependabot" ]; then
            echo "PR #$PR_NUMBER was opened by '$PR_AUTHOR', not Dependabot. Skipping."
            exit 0
          fi

          PR_STATE=$(gh pr view "$PR_NUMBER" --json state -q '.state' 2>/dev/null || true)
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is in state '$PR_STATE'. Skipping."
            exit 0
          fi

          echo "Approving PR #$PR_NUMBER..."
          gh pr review "$PR_NUMBER" --approve || true

          echo "Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Successfully merged PR #$PR_NUMBER!"

      - name: Batch auto-merge on manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching open Dependabot PRs..."
          PRS=$(gh pr list --app dependabot --state open --json number -q '.[].number')
          if [ -z "$PRS" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          for PR in $PRS; do
            echo "Inspecting PR #$PR checks..."
            # One unreadable PR must not end the batch. The step runs under
            # `bash -e`, so a bare failing command substitution aborts the job
            # rather than moving on to the next number in the list.
            if ! CHECKS=$(gh pr view "$PR" --json statusCheckRollup \
                            -q '.statusCheckRollup[]?.conclusion // empty'); then
              echo "Could not read checks for PR #$PR. Skipping."
              continue
            fi
            TOTAL=$(echo "$CHECKS" | wc -w)
            FAIL=$(echo "$CHECKS" | grep -v 'SUCCESS' | wc -w)

            if [ "$TOTAL" -gt 0 ] && [ "$FAIL" -eq 0 ]; then
              echo "PR #$PR passed all checks ($TOTAL checks). Merging..."
              gh pr review "$PR" --approve || true
              gh pr merge "$PR" --squash --delete-branch || true
            else
              echo "PR #$PR not ready or has failures. Skipping."
            fi
          done

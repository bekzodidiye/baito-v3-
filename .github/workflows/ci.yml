name: 🚀 Baito CI/CD & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================================
  # 1. BACKEND TESTS
  # ==========================================================
  test-backend:
    name: 🐍 1. Backend Tests
    runs-on: [self-hosted, laptop-test-runner]

    # The suite used to run on SQLite while production runs PostgreSQL, so the
    # things that only Postgres does were never exercised: SELECT ... FOR UPDATE
    # is a no-op on SQLite, which is exactly the lock the escrow tests exist to
    # prove. Ordering ties also resolve differently, which is how a flaky test
    # passed locally and failed here.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baito
          POSTGRES_PASSWORD: baito
          POSTGRES_DB: baito_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Asked for by name rather than inherited. The runner's own python3 is
      # whatever the machine happens to have - on this self-hosted runner that
      # is 3.14, which has no psycopg2-binary wheel, so pip fell back to a
      # source build and died on a missing pg_config:
      #
      #   Error: pg_config executable not found.
      #   ERROR: Failed to build 'psycopg2-binary'
      #
      # actions/setup-python cannot fix it here: it downloads Ubuntu builds,
      # and this runner is not Ubuntu -
      #   The version '3.11' with architecture 'x64' was not found
      #
      # 3.11 is what backend/Dockerfile runs (python:3.11-slim), so the suite
      # exercises the interpreter production uses. If a runner does not have
      # it, that is worth failing loudly for rather than quietly testing a
      # different Python than we ship.
      - name: Set up Python venv
        run: |
          PY="$(command -v python3.11 || true)"
          if [ -z "$PY" ]; then
            echo "::error title=No Python 3.11::This job needs python3.11 on PATH; production runs python:3.11-slim. Install it on the runner."
            exit 1
          fi
          "$PY" --version
          "$PY" -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The previous "test" step was a bare `import app.main` — it could not
      # fail on anything but a syntax error. The suite now actually runs.
      - name: Run Backend Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://baito:baito@localhost:5433/baito_test
          REDIS_URL: redis://localhost:6380/9
          SECRET_KEY: ci_only_secret_key_0123456789abcdef0123456789
          ENVIRONMENT: test
          BCRYPT_ROUNDS: "4"
          PYTHONPATH: .
        run: pytest tests/ -q

      # The service container creates one database; the migration check wants
      # a clean second one so it proves the migrations from empty.
      - name: Create Migration Database
        run: |
          PGPASSWORD=baito psql -h localhost -p 5433 -U baito -d baito_test \
            -c 'DROP DATABASE IF EXISTS baito_migrate' \
            -c 'CREATE DATABASE baito_migrate'

      - name: Verify Migrations Apply Cleanly
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://baito:baito@localhost:5433/baito_migrate
          SECRET_KEY: ci_only_secret_key_0123456789abcdef0123456789
          ENVIRONMENT: test
          PYTHONPATH: .
        run: alembic upgrade head

      # `|| true` used to end this line, which meant the step could not fail
      # and its 110 findings went unread. They are now either fixed or ignored
      # by name in backend/ruff.toml, so the gate can gate. The version is
      # pinned: an unpinned linter turns somebody else's release into a red
      # build on a branch that changed nothing.
      - name: Lint
        working-directory: ./backend
        run: |
          pip install ruff==0.5.0
          ruff check app/

  # ==========================================================
  # 2. FRONTEND TYPECHECK & PRODUCTION BUILD
  # ==========================================================
  test-frontend:
    name: 🎨 2. Frontend Typecheck & Build
    runs-on: [self-hosted, laptop-test-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # This step did not exist, which is how two type errors reached main.
      - name: Typecheck
        working-directory: ./frontend
        run: npm run lint

      # The frontend had no unit layer at all: every defect found in it this
      # year was found by hand, which does not scale and does not survive the
      # session that found it.
      - name: Unit Tests
        working-directory: ./frontend
        run: npm test

      # Five high-severity advisories shipped in the production bundle without
      # anything noticing, because nothing looked. --omit=dev because a build
      # tool's advisory does not reach a user's browser; a runtime one does.
      # npm 10, which ships with Node 20, audits through
      # /-/npm/v1/security/audits/quick. npm says of that endpoint: "This
      # endpoint is being retired. Use the bulk advisory endpoint instead" —
      # and it has been answering 503 and 400 for us. Newer npm uses the bulk
      # endpoint, which works. Upgraded after `npm ci` so only the audit is
      # affected and the install stays on the version the lockfile was made
      # with.
      - name: Use an npm that does not audit through a retiring endpoint
        run: npm install -g npm@11

      - name: Audit Production Dependencies
        working-directory: ./frontend
        # Retried because the registry's audit endpoint answers 503 often enough
        # to fail a build on its own — it did, on a PR whose lint and tests had
        # both passed. The retry is only for reaching the endpoint: a real
        # advisory still fails the job on the first attempt, since npm exits
        # non-zero with findings rather than with an endpoint error. Never
        # replace this with `|| true`; the point of the gate is that it blocks.
        run: |
          # --fetch-timeout so a dead endpoint fails in seconds. Without it npm
          # retries internally for ~6 minutes per call, so three attempts took
          # twenty and still only spanned one outage window; failing fast lets
          # more attempts cover more real time.
          attempts=5
          for attempt in $(seq 1 $attempts); do
            out=$(npm audit --omit=dev --audit-level=high --fetch-timeout=30000 --fetch-retries=1 2>&1) && exit 0
            printf '%s\n' "$out"
            if ! printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|network timeout|request to .* failed'; then
              echo "::error::Audit found a high-severity advisory in a production dependency."
              exit 1
            fi
            echo "::warning::Audit endpoint unreachable (attempt ${attempt}/${attempts}); retrying."
            sleep $((attempt * 20))
          done
          echo "::error::Could not reach the npm audit endpoint after ${attempts} attempts."
          exit 1

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build

  # ==========================================================
  # 2b. END-TO-END
  # ==========================================================
  test-e2e:
    name: 🎭 2b. End-to-End
    runs-on: [self-hosted, laptop-test-runner]

    # Five Playwright specs sat in the repo and nothing ran them. Running them
    # for the first time found that two asserted a flow this app has never had,
    # and that all five were being blocked by the onboarding tour before they
    # reached anything. Both are fixed; this job is what stops it recurring.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: baito
          POSTGRES_PASSWORD: baito
          POSTGRES_DB: baito_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://baito:baito@localhost:5434/baito_e2e
      REDIS_URL: redis://localhost:6381/8
      SECRET_KEY: ci_only_secret_key_0123456789abcdef0123456789
      ENVIRONMENT: development
      BCRYPT_ROUNDS: "4"
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Asked for by name rather than inherited. The runner's own python3 is
      # whatever the machine happens to have - on this self-hosted runner that
      # is 3.14, which has no psycopg2-binary wheel, so pip fell back to a
      # source build and died on a missing pg_config:
      #
      #   Error: pg_config executable not found.
      #   ERROR: Failed to build 'psycopg2-binary'
      #
      # actions/setup-python cannot fix it here: it downloads Ubuntu builds,
      # and this runner is not Ubuntu -
      #   The version '3.11' with architecture 'x64' was not found
      #
      # 3.11 is what backend/Dockerfile runs (python:3.11-slim), so the suite
      # exercises the interpreter production uses. If a runner does not have
      # it, that is worth failing loudly for rather than quietly testing a
      # different Python than we ship.
      - name: Set up Python venv
        run: |
          PY="$(command -v python3.11 || true)"
          if [ -z "$PY" ]; then
            echo "::error title=No Python 3.11::This job needs python3.11 on PATH; production runs python:3.11-slim. Install it on the runner."
            exit 1
          fi
          "$PY" --version
          "$PY" -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate
        working-directory: ./backend
        run: alembic upgrade head

      # The password is generated here and exported to the job, never written
      # into a file and never printed. `::add-mask::` keeps it out of the log
      # even if a later step echoes it by accident.
      - name: Seed a Throwaway Account
        working-directory: ./backend
        run: |
          OUT=$(python scripts/create_accounts.py 'employer:+998900004001:CI E2E')
          PHONE=$(echo "$OUT" | awk '/employer/ {print $2}')
          PASS=$(echo "$OUT" | awk '/employer/ {print $3}')
          if [ -z "$PHONE" ] || [ -z "$PASS" ]; then
            echo "Seeding produced no credentials; the E2E sign-in test would skip silently." >&2
            exit 1
          fi
          echo "::add-mask::$PASS"
          echo "E2E_PHONE=$PHONE" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Start the API
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8000/docs && exit 0
            sleep 1
          done
          echo "API did not come up within 60s" >&2
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the bundle and serves it with `vite preview`,
      # so this exercises what ships rather than the dev server.
      - name: Run End-to-End Suite
        working-directory: ./frontend
        run: npm run test:e2e -- --project=chromium

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================
  # 3. DOCKER ARCHITECTURE VALIDATION
  # ==========================================================
  validate-docker:
    name: 🐳 3. Docker Compose Validation
    needs: [test-backend, test-frontend, test-e2e]
    runs-on: [self-hosted, laptop-test-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          # compose now refuses to render without these; supply throwaways.
          SECRET_KEY: ci_placeholder
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci_placeholder
          TELEGRAM_BOT_TOKEN: ci_placeholder
          TELEGRAM_CHAT_ID: "0"
        run: |
          touch backend/.env
          docker compose config > /dev/null

      - name: Assert No Dangling Submodule Pointers
        run: |
          # A directory committed as a gitlink (mode 160000) with no matching
          # .gitmodules entry makes actions/checkout fail `git submodule
          # status`, decide the working copy is unusable, and re-clone the
          # whole repository on every single run. AI-rules did exactly this and
          # left the deploy job hung on checkout for 13-19 minutes at a time.
          links=$(git ls-files -s | awk '$1 == "160000" { print $4 }')
          if [ -n "$links" ] && [ ! -f .gitmodules ]; then
            echo "::error::Gitlink entries exist but .gitmodules is missing:"
            echo "$links" | sed 's/^/  /'
            exit 1
          fi

      - name: Assert No Secrets Are Committed
        run: |
          # Guards against the class of finding that started this: a live bot
          # token and a JWT signing key shipped as compose defaults.
          if grep -rnE '(TELEGRAM_BOT_TOKEN|SECRET_KEY|POSTGRES_PASSWORD|MINIO_ROOT_PASSWORD)\s*[:=]\s*\$\{[A-Z_]+:-[^}]+\}' \
               docker-compose.yml; then
            echo "::error::A secret has a committed default value in docker-compose.yml"
            exit 1
          fi
          if grep -rnE '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.ts' --include='*.tsx' .; then
            echo "::error::A Telegram bot token appears to be committed"
            exit 1
          fi

  # ==========================================================
  # 4. PRODUCTION DEPLOYMENT
  # ==========================================================
  # A deploy that never starts is the failure mode this pipeline is worst at
  # reporting: the job sits on "Waiting for a runner to pick up this job", the
  # run stays yellow, and nothing is ever sent to anyone. It happened again on
  # 2026-09-05 — every self-hosted runner offline, two merges queued behind it,
  # one of them for 15 hours — and the only reason it was noticed is that
  # somebody went looking.
  #
  # timeout-minutes does not cover this. It bounds how long a job may *run*,
  # and starts counting once a runner picks the job up; a job nobody picks up
  # is not running, so the clock never starts. GitHub drops such a job after 24
  # hours, silently. This job is the missing alarm.
  deploy-watchdog:
    name: ⏱️ 4b. Deploy Runner Watchdog
    needs: [test-backend, test-frontend, test-e2e, validate-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, laptop-test-runner]
    permissions:
      actions: read
    timeout-minutes: 20
    steps:
      - name: ⏱️ Fail loudly if no runner takes the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          # Long enough to cover a runner restarting on its own, short enough
          # that a human hears about it the same hour.
          WAIT_SECONDS: 900
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + WAIT_SECONDS ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                       --jq '.jobs[] | select(.name | contains("Production Deploy")) | .status' \
                     2>/dev/null || echo "")
            case "$status" in
              in_progress|completed)
                echo "✅ A runner picked the deploy up (${status})."
                exit 0
                ;;
            esac
            echo "⏳ Deploy still queued after $SECONDS s..."
            sleep 30
          done

          echo "::error title=No deploy runner::The deploy has been queued for \
          ${WAIT_SECONDS}s with no self-hosted runner to take it, so this commit \
          is NOT on the server. Bring a runner back up on the box \
          (sudo systemctl status 'actions.runner.*'), then re-run this job."
          exit 1

  deploy:
    name: 🚀 4. Production Deploy
    needs: [test-backend, test-frontend, test-e2e, validate-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The server has no public address — it is only reachable inside the
    # tailnet — so deployment has to run on the box itself. That makes the
    # self-hosted runner a hard dependency.
    #
    # `baito-server` is not decoration. Once a second self-hosted runner was
    # registered (the laptop that now runs the tests), a bare `self-hosted`
    # matched both, and a deploy could land on whichever was free. On the
    # laptop it would mkdir /home/scarygun/IntellexGroup/Baito, build the whole
    # stack there, pass its own health check and report success — while the
    # server got nothing. The label names the one machine that is the server.
    runs-on: [self-hosted, baito-server]
    # Deploys must not stack. When runners were offline, two runs queued: an
    # older commit and a newer one. Whichever a returning runner happened to
    # take second would have been the build left on the server — so the older
    # commit could have overwritten the newer one. That had to be untangled by
    # hand.
    #
    # cancel-in-progress is deliberately false: a deploy that is already
    # running is mid-way through swapping containers and migrating the
    # database, and killing it there is far worse than a stale queue. With it
    # false, GitHub cancels the older *pending* run instead and keeps the
    # newest — which is the one that should land.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Bounds how long the deploy may run once a runner has it. It does not, and
    # cannot, bound how long it waits for one — that is deploy-watchdog's job.
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout Code on Server
        uses: actions/checkout@v4

      - name: 🔄 Sync Workspace
        run: |
          echo "📁 Syncing repository files from $GITHUB_WORKSPACE..."
          mkdir -p /home/scarygun/IntellexGroup/Baito
          rsync -av --delete \
            --exclude '.env' \
            --exclude 'backend/.env' \
            --exclude 'postgres_data' \
            --exclude 'redis_data' \
            --exclude 'minio_data' \
            --exclude 'backups' \
            --exclude 'backups/*' \
            --exclude 'baito_local_backups' \
            --exclude '.deploy-history' \
            "$GITHUB_WORKSPACE/" /home/scarygun/IntellexGroup/Baito/

      - name: 🏷️ Record the currently running build
        working-directory: /home/scarygun/IntellexGroup/Baito
        run: |
          # Captured before anything changes so the health check below has
          # something to roll back to.
          prev=$(docker inspect baito-backend-1 --format '{{.Config.Image}}' 2>/dev/null \
                 | cut -d: -f2 || true)
          echo "PREVIOUS_TAG=${prev:-}" >> "$GITHUB_ENV"
          echo "Previously running: ${prev:-none}"

      - name: 🔨 Build Images
        working-directory: /home/scarygun/IntellexGroup/Baito
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build first, swap second. `up -d --build` used to rebuild while the
          # old containers were already down, so the site was offline for the
          # whole build rather than for the few seconds a swap takes.
          #
          # The frontend's build context is ./frontend, so the root
          # package.json holding the version is not visible from inside it.
          # Read it here and hand it to compose as a build arg.
          export APP_VERSION="$(node -p "require('./package.json').version" 2>/dev/null || echo '')"
          echo "Building frontend as version '${APP_VERSION}'"
          docker compose build

      - name: 🗄️ Apply Database Migrations
        working-directory: /home/scarygun/IntellexGroup/Baito
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose run --rm migrate

      - name: 🚀 Swap Containers
        working-directory: /home/scarygun/IntellexGroup/Baito
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d --no-build --remove-orphans

      - name: 🩺 Verify Deployment Health
        working-directory: /home/scarygun/IntellexGroup/Baito
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Deployment used to report success the moment compose returned,
          # regardless of whether the app came up.
          for i in $(seq 1 30); do
            status=$(docker compose exec -T backend \
              curl -fsS http://localhost:8000/api/health | grep -o '"status":"[a-z]*"' || true)
            if [ "$status" = '"status":"ok"' ]; then
              echo "✅ Backend healthy on ${GITHUB_SHA:0:7}"
              # Move `current` onto the build that just proved itself.
              #
              # compose reads `${IMAGE_TAG:-current}`, so `current` is what runs
              # when somebody types `docker compose up -d` on the server without
              # setting IMAGE_TAG — which is the obvious thing to type. Nothing
              # ever moved the tag, so it pointed at whatever ancient build had
              # last been built without one, and a manual restart silently
              # downgraded the site. That is how a deploy that had already
              # succeeded ended up serving 502: the old image's alembic could
              # not find the revision the database was already on.
              #
              # Tagged here rather than after the build, so `current` only ever
              # names an image that answered /api/health.
              for img in baito-backend baito-frontend baito-backup-bot; do
                if docker image inspect "$img:${GITHUB_SHA}" >/dev/null 2>&1; then
                  docker tag "$img:${GITHUB_SHA}" "$img:current"
                fi
              done
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA} deploy" >> .deploy-history
              exit 0
            fi
            echo "⏳ Waiting for backend health ($i/30)..."
            sleep 5
          done

          echo "::error::Backend did not become healthy"
          docker compose logs --tail=100 backend

          if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "current" ]; then
            echo "::warning::Rolling back to ${PREVIOUS_TAG}"
            IMAGE_TAG="${PREVIOUS_TAG}" docker compose up -d --no-build
            for i in $(seq 1 20); do
              status=$(docker compose exec -T backend \
                curl -fsS http://localhost:8000/api/health | grep -o '"status":"[a-z]*"' || true)
              if [ "$status" = '"status":"ok"' ]; then
                echo "↩️  Rolled back to ${PREVIOUS_TAG}; the site is up on the previous build."
                # And `current` follows the rollback, or the next manual restart
                # would put the failed build back.
                for img in baito-backend baito-frontend baito-backup-bot; do
                  if docker image inspect "$img:${PREVIOUS_TAG}" >/dev/null 2>&1; then
                    docker tag "$img:${PREVIOUS_TAG}" "$img:current"
                  fi
                done
                break
              fi
              sleep 5
            done
          else
            echo "::warning::No previous tagged build to roll back to."
          fi
          exit 1

      - name: 🧹 Prune old images
        if: always()
        working-directory: /home/scarygun/IntellexGroup/Baito
        run: |
          # Keep the five most recent builds per image so rollback has targets
          # without letting the disk fill.
          for repo in baito-backend baito-frontend baito-backup-bot; do
            docker images "$repo" --format '{{.Tag}} {{.CreatedAt}}' \
              | grep -v '^current ' | sort -k2 -r | tail -n +6 | awk '{print $1}' \
              | while read -r tag; do docker rmi "$repo:$tag" >/dev/null 2>&1 || true; done
          done

          # The build cache had no bound at all: a day of frequent deploys took
          # it from 3.4 GB to 12.3 GB. Keep a week of it so rebuilds stay fast
          # without the growth being open-ended.
          docker builder prune --force --filter 'until=168h' >/dev/null 2>&1 || true

      - name: 📣 Report a failed deploy
        # Deploys used to fail — or never run at all — with no signal anywhere.
        # The backup bot already owns a Telegram channel; reuse it so a broken
        # deploy reaches a human instead of sitting in the Actions tab.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not configured; no alert sent."
            exit 0
          fi
          # Built with printf rather than a literal multi-line string: an
          # unindented continuation line ends the YAML block scalar and turns
          # into a top-level key, which makes the whole workflow file invalid.
          text=$(printf '%s\n%s\n%s' \
            "🚨 <b>Baito deploy yiqildi</b>" \
            "commit: <code>${GITHUB_SHA:0:7}</code>" \
            "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            --data-urlencode "text=${text}" >/dev/null
